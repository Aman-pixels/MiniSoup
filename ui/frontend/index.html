<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniSoup | Autonomous Bug-Fixing Agent</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #047857;
      color: #ecfdf5;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Lush Greenish Emerald Canvas Gradient */
    .bg-emerald-canvas {
      background: radial-gradient(circle at 75% 30%, #10b981 0%, #059669 28%, #047857 60%, #022c22 100%);
    }

    /* Emerald Glass Panels */
    .glass-card {
      background: rgba(4, 30, 22, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(52, 211, 153, 0.22);
    }
    
    .glass-pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    .diff-add {
      background-color: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border-left: 3px solid #10b981;
    }
    .diff-del {
      background-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-left: 3px solid #ef4444;
    }
    .diff-hdr {
      background-color: rgba(45, 212, 191, 0.15);
      color: #a7f3d0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(52, 211, 153, 0.35);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(52, 211, 153, 0.6);
    }

    /* Glow Keyframes */
    @keyframes emeraldPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 16px rgba(52, 211, 153, 0.6)); }
    }
    .animate-emerald-pulse {
      animation: emeraldPulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-emerald-canvas min-h-screen relative flex flex-col justify-between selection:bg-emerald-900 selection:text-emerald-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FALLBACK_BUGS = [
      {
        id: "bug-3",
        title: "Cart Quantity Off-By-One",
        module: "ecommerce/cart.py",
        description: "Off-by-one error in cart quantity update (setting quantity to 5 yields 6)."
      },
      {
        id: "bug-1",
        title: "JWT Cookie Logout on Refresh",
        module: "ecommerce/auth.py",
        description: "Users logged out on page refresh because cookies send 'auth_jwt' key."
      },
      {
        id: "bug-2",
        title: "Broken Order API & Auth Header",
        module: "ecommerce/api_client.py",
        description: "Calls deprecated /v1/order endpoint and misses Authorization header."
      },
      {
        id: "bug-4",
        title: "Null-Pointer Empty Checkout",
        module: "ecommerce/checkout.py",
        description: "Checking out with an empty cart crashes with IndexError on empty items list."
      }
    ];

    const PIPELINE_STEPS = [
      { id: "retrieve", label: "Retrieve", desc: "AST Semantic Chunks", icon: "fa-search" },
      { id: "plan", label: "Plan", desc: "Root Cause Diagnosis", icon: "fa-brain" },
      { id: "edit", label: "Edit", desc: "Surgical Code Patch", icon: "fa-code" },
      { id: "test", label: "Test", desc: "Docker Sandbox", icon: "fa-flask" },
      { id: "review", label: "Review", desc: "Scope Creep Audit", icon: "fa-shield-halved" }
    ];

    // --- Interactive Three.js 3D MiniSoup Emerald Quantum Core ---
    function ThreeScene({ agentState, activeNode }) {
      const mountRef = useRef(null);
      const stateRef = useRef({ agentState, activeNode });
      stateRef.current = { agentState, activeNode };

      useEffect(() => {
        const mount = mountRef.current;
        if (!mount) return;

        const width = mount.clientWidth || 450;
        const height = mount.clientHeight || 450;

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0.3, 4.6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(width, height, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.domElement.style.width = "100%";
        renderer.domElement.style.height = "100%";
        renderer.domElement.style.display = "block";
        mount.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 1.7;
        controls.minPolarAngle = Math.PI / 3.0;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x064e3b, 1.2);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xa7f3d0, 1.8);
        keyLight.position.set(4, 5, 4);
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0x34d399, 1.2);
        rimLight.position.set(-4, -2, -3);
        scene.add(rimLight);

        const pointCore = new THREE.PointLight(0x10b981, 3.2, 8);
        pointCore.position.set(0, 0, 0);
        scene.add(pointCore);

        // --- Core Hierarchy ---
        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // 1. Inner Faceted Quantum Crystal
        const crystalGeom = new THREE.OctahedronGeometry(0.72, 0);
        const crystalMat = new THREE.MeshStandardMaterial({
          color: 0x059669,
          emissive: 0x047857,
          emissiveIntensity: 0.8,
          roughness: 0.18,
          metalness: 0.85,
          flatShading: true
        });
        const crystalMesh = new THREE.Mesh(crystalGeom, crystalMat);
        coreGroup.add(crystalMesh);

        // Crystal Wireframe Accent
        const wireGeom = new THREE.WireframeGeometry(crystalGeom);
        const wireMat = new THREE.LineBasicMaterial({
          color: 0x6ee7b7,
          transparent: true,
          opacity: 0.75
        });
        const wireMesh = new THREE.LineSegments(wireGeom, wireMat);
        coreGroup.add(wireMesh);

        // 2. Translucent Faceted Emerald Glass Shell
        const shellGeom = new THREE.IcosahedronGeometry(1.15, 2);
        const shellMat = new THREE.MeshPhysicalMaterial({
          color: 0x10b981,
          emissive: 0x064e3b,
          emissiveIntensity: 0.25,
          roughness: 0.12,
          metalness: 0.15,
          transmission: 0.65,
          thickness: 0.6,
          transparent: true,
          opacity: 0.82,
          clearcoat: 1.0,
          clearcoatRoughness: 0.1
        });
        const shellMesh = new THREE.Mesh(shellGeom, shellMat);
        coreGroup.add(shellMesh);

        // 3. Central Equator Glowing Pulse Ring
        const ringGeom = new THREE.TorusGeometry(1.22, 0.025, 16, 80);
        ringGeom.rotateX(Math.PI / 2);
        const glowRingMat = new THREE.MeshBasicMaterial({
          color: 0x34d399,
          transparent: true,
          opacity: 0.9
        });
        const glowRing = new THREE.Mesh(ringGeom, glowRingMat);
        coreGroup.add(glowRing);

        // 4. Orbital Gimbal Rings
        const gimbal1Geom = new THREE.TorusGeometry(1.68, 0.018, 16, 96);
        const ring1Mat = new THREE.MeshStandardMaterial({
          color: 0x6ee7b7,
          roughness: 0.2,
          metalness: 0.9
        });
        const gimbal1 = new THREE.Mesh(gimbal1Geom, ring1Mat);
        gimbal1.rotation.x = Math.PI / 3;
        scene.add(gimbal1);

        const gimbal2Geom = new THREE.TorusGeometry(1.98, 0.015, 16, 96);
        const ring2Mat = new THREE.MeshStandardMaterial({
          color: 0x34d399,
          roughness: 0.25,
          metalness: 0.85
        });
        const gimbal2 = new THREE.Mesh(gimbal2Geom, ring2Mat);
        gimbal2.rotation.x = -Math.PI / 4;
        gimbal2.rotation.y = Math.PI / 6;
        scene.add(gimbal2);

        // Satellite beads on rings
        const satGeom = new THREE.SphereGeometry(0.055, 16, 16);
        const satMat = new THREE.MeshBasicMaterial({ color: 0xa7f3d0 });
        const sat1 = new THREE.Mesh(satGeom, satMat);
        const sat2 = new THREE.Mesh(satGeom, satMat);
        scene.add(sat1);
        scene.add(sat2);

        // 5. AST Floating Particle Dust (Semantic Chunks)
        const particleCount = 70;
        const particleGeom = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos((Math.random() * 2) - 1);
          const r = 1.8 + Math.random() * 0.9;
          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);
        }
        particleGeom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
          color: 0xa7f3d0,
          size: 0.035,
          transparent: true,
          opacity: 0.65
        });
        const particles = new THREE.Points(particleGeom, particleMat);
        scene.add(particles);

        // Ground Contact Glow Shadow
        const shadowCanvas = document.createElement("canvas");
        shadowCanvas.width = 128;
        shadowCanvas.height = 128;
        const sCtx = shadowCanvas.getContext("2d");
        const gradient = sCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, "rgba(2, 44, 34, 0.7)");
        gradient.addColorStop(0.5, "rgba(2, 44, 34, 0.25)");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
        sCtx.fillStyle = gradient;
        sCtx.fillRect(0, 0, 128, 128);

        const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
        const shadowPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(3.2, 3.2),
          new THREE.MeshBasicMaterial({ map: shadowTexture, transparent: true, opacity: 0.75 })
        );
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -1.6;
        scene.add(shadowPlane);

        // Responsive ResizeObserver
        const resizeObserver = new ResizeObserver((entries) => {
          for (let entry of entries) {
            const w = entry.contentRect.width;
            const h = entry.contentRect.height;
            if (w > 0 && h > 0) {
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              renderer.setSize(w, h, false);
            }
          }
        });
        resizeObserver.observe(mount);

        // Animation Loop
        let clock = new THREE.Clock();
        let reqId;

        const animate = () => {
          reqId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();
          const { agentState: st, activeNode: node } = stateRef.current;

          controls.update();

          // Float bobbing
          const floatSpeed = st === "running" ? 2.4 : 1.2;
          const floatAmp = 0.08;
          coreGroup.position.y = Math.sin(t * floatSpeed) * floatAmp;

          // Gentle continuous rotation
          crystalMesh.rotation.y += 0.008;
          crystalMesh.rotation.x += 0.004;
          wireMesh.rotation.y = crystalMesh.rotation.y;
          wireMesh.rotation.x = crystalMesh.rotation.x;

          shellMesh.rotation.y -= 0.003;
          shellMesh.rotation.z += 0.002;

          // Gimbal orbital rotation
          gimbal1.rotation.z += 0.008;
          gimbal1.rotation.y += 0.005;
          gimbal2.rotation.z -= 0.006;
          gimbal2.rotation.x += 0.004;

          // Satellites orbiting along gimbals
          const a1 = t * 1.2;
          sat1.position.set(
            Math.cos(a1) * 1.68 * Math.cos(gimbal1.rotation.x),
            Math.sin(a1) * 1.68,
            Math.cos(a1) * 1.68 * Math.sin(gimbal1.rotation.x)
          );
          const a2 = -t * 0.9;
          sat2.position.set(
            Math.cos(a2) * 1.98,
            Math.sin(a2) * 1.98 * Math.cos(gimbal2.rotation.x),
            Math.sin(a2) * 1.98 * Math.sin(gimbal2.rotation.x)
          );

          // Particles gentle drift
          particles.rotation.y += 0.0015;
          particles.rotation.x = Math.sin(t * 0.3) * 0.05;

          // State-Reactive Animation
          if (st === "running") {
            if (node === "retrieve") {
              glowRingMat.color.setHex(0x38bdf8);
              pointCore.color.setHex(0x38bdf8);
              gimbal1.rotation.z += 0.02;
              glowRing.scale.setScalar(1 + Math.sin(t * 8) * 0.08);
            } else if (node === "plan") {
              glowRingMat.color.setHex(0x34d399);
              pointCore.color.setHex(0x34d399);
              crystalMesh.scale.setScalar(1 + Math.sin(t * 4) * 0.08);
              wireMesh.scale.copy(crystalMesh.scale);
            } else if (node === "edit") {
              glowRingMat.color.setHex(0x10b981);
              pointCore.color.setHex(0x10b981);
              crystalMesh.rotation.y += 0.025;
              wireMesh.rotation.y = crystalMesh.rotation.y;
            } else if (node === "test") {
              glowRingMat.color.setHex(0x6ee7b7);
              pointCore.color.setHex(0x6ee7b7);
              gimbal1.rotation.z += 0.03;
              gimbal2.rotation.z -= 0.03;
            } else if (node === "revert_and_debug") {
              // Test failure retry pulse: Amber
              glowRingMat.color.setHex(0xf59e0b);
              pointCore.color.setHex(0xf59e0b);
              glowRing.scale.setScalar(1 + Math.sin(t * 10) * 0.12);
            } else if (node === "review") {
              glowRingMat.color.setHex(0xa7f3d0);
              pointCore.color.setHex(0xa7f3d0);
            }
          } else if (st === "completed") {
            glowRingMat.color.setHex(0x10b981);
            pointCore.color.setHex(0x10b981);
            glowRing.scale.setScalar(1 + Math.sin(t * 3) * 0.04);
            crystalMesh.scale.setScalar(1);
            wireMesh.scale.setScalar(1);
          } else {
            glowRingMat.color.setHex(0x34d399);
            pointCore.color.setHex(0x34d399);
            glowRing.scale.setScalar(1);
            crystalMesh.scale.setScalar(1);
            wireMesh.scale.setScalar(1);
          }

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          resizeObserver.disconnect();
          cancelAnimationFrame(reqId);
          controls.dispose();
          renderer.dispose();
          if (mount && renderer.domElement) {
            mount.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing select-none" />;
    }

    // --- Main App Component ---
    function App() {
      const [repoPath, setRepoPath] = useState("");
      const [defaultRepoPath, setDefaultRepoPath] = useState("");
      const [isValidatingRepo, setIsValidatingRepo] = useState(false);
      const [repoStatus, setRepoStatus] = useState({
        exists: true,
        is_dir: true,
        is_git: true,
        branch: "main",
        test_framework: "pytest",
        test_command: "pytest",
        is_valid: true,
        status_summary: "valid"
      });
      const [isRepoConfigOpen, setIsRepoConfigOpen] = useState(false);

      const [bugReport, setBugReport] = useState("Off-by-one error in cart quantity update");
      const [demoBugs, setDemoBugs] = useState(FALLBACK_BUGS);
      const [status, setStatus] = useState("idle");
      const [activeNode, setActiveNode] = useState(null);
      const [logs, setLogs] = useState([]);
      const [plan, setPlan] = useState("");
      const [diff, setDiff] = useState("");
      const [prBody, setPrBody] = useState("");
      const [iteration, setIteration] = useState(0);
      const [maxIterations, setMaxIterations] = useState(4);
      const [reviewStatus, setReviewStatus] = useState(null);
      const [reviewFeedback, setReviewFeedback] = useState("");
      const [testResult, setTestResult] = useState(null);
      const [testFailedRetrying, setTestFailedRetrying] = useState(false);
      const [completedStages, setCompletedStages] = useState(new Set());
      const [activeTab, setActiveTab] = useState("diff");
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [copied, setCopied] = useState(false);

      const wsRef = useRef(null);
      const logsEndRef = useRef(null);

      // Initial load: fetch default repo info and demo bugs
      useEffect(() => {
        fetch("/api/repo-info")
          .then(res => res.json())
          .then(data => {
            setDefaultRepoPath(data.default_path || "");
            setRepoPath(data.default_path || "");
            setRepoStatus({
              exists: data.exists,
              is_dir: data.is_dir,
              is_git: data.is_git,
              branch: data.branch,
              test_framework: data.test_framework,
              test_command: data.test_command,
              is_valid: data.is_valid,
              status_summary: data.status_summary
            });
          })
          .catch(() => {});

        fetch("/api/demo-bugs")
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length) setDemoBugs(data);
          })
          .catch(() => {});
      }, []);

      // Debounced repo path validation on input change
      useEffect(() => {
        if (!repoPath || !repoPath.trim()) {
          setRepoStatus({
            exists: false,
            is_dir: false,
            is_git: false,
            branch: "",
            test_framework: null,
            test_command: null,
            is_valid: false,
            status_summary: "empty"
          });
          setIsValidatingRepo(false);
          return;
        }

        setIsValidatingRepo(true);
        const timer = setTimeout(() => {
          fetch(`/api/repo-info?path=${encodeURIComponent(repoPath.trim())}`)
            .then(res => res.json())
            .then(data => {
              setRepoStatus({
                exists: data.exists,
                is_dir: data.is_dir,
                is_git: data.is_git,
                branch: data.branch,
                test_framework: data.test_framework,
                test_command: data.test_command,
                is_valid: data.is_valid,
                status_summary: data.status_summary
              });
              setIsValidatingRepo(false);
            })
            .catch(() => {
              setIsValidatingRepo(false);
            });
        }, 350);

        return () => clearTimeout(timer);
      }, [repoPath]);

      const startBugFix = () => {
        if (!bugReport.trim() || status === "running" || !repoStatus.is_valid) return;

        setStatus("running");
        setLogs([]);
        setPlan("");
        setDiff("");
        setPrBody("");
        setActiveNode("retrieve");
        setIteration(1);
        setReviewStatus(null);
        setReviewFeedback("");
        setTestResult(null);
        setTestFailedRetrying(false);
        setCompletedStages(new Set());
        setIsDrawerOpen(true);
        setActiveTab("trace");

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws/fix`;
        const ws = new WebSocket(wsUrl);
        wsRef.current = ws;

        ws.onopen = () => {
          ws.send(JSON.stringify({
            bug_report: bugReport,
            repo_path: repoPath,
            max_iterations: maxIterations
          }));
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === "started") {
            setLogs(prev => [...prev, {
              timestamp: new Date().toLocaleTimeString(),
              node: "system",
              text: `Agent initialized on repo: ${msg.repo_path || repoPath}\nAttempt branch created: ${msg.branch}`
            }]);
          } else if (msg.type === "node_update") {
            setActiveNode(msg.node);
            if (msg.iteration) setIteration(msg.iteration);
            if (msg.plan) setPlan(msg.plan);
            if (msg.current_diff) setDiff(msg.current_diff);
            if (msg.test_result) {
              setTestResult(msg.test_result);
              if (msg.test_result.passed === false) {
                setTestFailedRetrying(true);
              } else if (msg.test_result.passed === true) {
                setTestFailedRetrying(false);
              }
            }
            if (msg.review_status && msg.review_status !== "pending") {
              setReviewStatus(msg.review_status);
            }
            if (msg.review_feedback) {
              setReviewFeedback(msg.review_feedback);
            }

            // Sequential stage progression tracking
            if (msg.node === "retrieve") {
              // Retrieve active
            } else if (msg.node === "plan") {
              setCompletedStages(prev => new Set([...prev, "retrieve"]));
            } else if (msg.node === "edit") {
              setCompletedStages(prev => new Set([...prev, "retrieve", "plan"]));
            } else if (msg.node === "test") {
              setCompletedStages(prev => new Set([...prev, "retrieve", "plan", "edit"]));
              setTestFailedRetrying(false);
            } else if (msg.node === "revert_and_debug") {
              // Test failed, reverting and preparing next attempt
              setTestFailedRetrying(true);
              setCompletedStages(prev => new Set([...prev, "retrieve", "plan", "edit"]));
            } else if (msg.node === "review") {
              setTestFailedRetrying(false);
              setCompletedStages(prev => new Set([...prev, "retrieve", "plan", "edit", "test"]));
            } else if (msg.node === "revert_and_replan_after_review") {
              setCompletedStages(prev => new Set([...prev, "retrieve", "plan", "edit", "test"]));
            }

            setLogs(prev => [...prev, {
              timestamp: new Date().toLocaleTimeString(),
              node: msg.node,
              text: msg.log
            }]);
          } else if (msg.type === "completed") {
            setStatus("completed");
            setActiveNode(null);
            setDiff(msg.diff);
            setPrBody(msg.pr_body);
            setReviewStatus(msg.review_status);
            setTestFailedRetrying(false);
            if (msg.passed) {
              setCompletedStages(new Set(["retrieve", "plan", "edit", "test", "review"]));
            } else {
              setCompletedStages(new Set(["retrieve", "plan", "edit"]));
            }

              node: "error",
              text: `Error: ${msg.message}`

                    activeTab === "plan"
                      ? "border-emerald-400 text-emerald-300"
                      : "border-transparent text-emerald-100/60 hover:text-white"
                  }`}
                >
                  <i className="fa-solid fa-brain"></i>
                  <span>Diagnostic Plan</span>
                  {plan && <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>}
                </button>

                <button
                  onClick={() => setActiveTab("pr")}
                  className={`py-3 px-4 text-xs font-bold flex items-center gap-2 border-b-2 transition-all ${
                    activeTab === "pr"
                      ? "border-emerald-400 text-emerald-300"
                      : "border-transparent text-emerald-100/60 hover:text-white"
                  }`}
                >
                  <i className="fa-solid fa-code-pull-request"></i>
                  <span>Pull Request Summary</span>
                  {prBody && <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>}
                </button>

                <button
                  onClick={() => setActiveTab("trace")}
                  className={`py-3 px-4 text-xs font-bold flex items-center gap-2 border-b-2 transition-all ${
                    activeTab === "trace"
                      ? "border-emerald-400 text-emerald-300"
                      : "border-transparent text-emerald-100/60 hover:text-white"
                  }`}
                >
                  <i className="fa-solid fa-list-check"></i>
                  <span>Live Stream Logs ({logs.length})</span>
                </button>
              </div>

              {/* Tab Contents */}
              <div className="flex-1 overflow-y-auto p-6 bg-black/50">
                {activeTab === "diff" && (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="text-xs font-mono text-emerald-200/70">
                        Zero auto-merge: verified surgical diff against <span className="text-white font-bold">main</span>
                      </div>
                      {diff && (
                        <button
                          onClick={() => copyToClipboard(diff)}
                          className="px-3 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 border border-emerald-400/30 text-xs font-medium flex items-center gap-1.5 transition-all"
                        >
                          <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                          <span>{copied ? "Copied Diff" : "Copy Diff"}</span>
                        </button>
                      )}
                    </div>
                    {renderDiff(diff)}
                  </div>
                )}

                {activeTab === "plan" && (
                  <div className="space-y-3">
                    <div className="text-xs font-mono text-emerald-200/70">
                      Architect Persona: Root cause analysis and step-by-step repair strategy
                    </div>
                    {plan ? (
                      <div className="bg-[#021c14] p-5 rounded-xl border border-emerald-500/20 font-sans text-xs text-emerald-50 leading-relaxed whitespace-pre-wrap">
                        {plan}
                      </div>
                    ) : (
                      <div className="p-12 text-center text-emerald-300/60 italic font-mono text-sm">
                        No diagnostic plan created yet. Run an autonomous fix to formulate a plan.
                      </div>
                    )}
                  </div>
                )}

                {activeTab === "pr" && (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="text-xs font-mono text-emerald-200/70">
                        Ready-to-copy PR body formatted for human engineering review
                      </div>
                      {prBody && (
                        <button
                          onClick={() => copyToClipboard(prBody)}
                          className="px-3 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 border border-emerald-400/30 text-xs font-medium flex items-center gap-1.5 transition-all"
                        >
                          <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                          <span>{copied ? "Copied Markdown" : "Copy PR Markdown"}</span>
                        </button>
                      )}
                    </div>
                    {prBody ? (
                      <div className="bg-[#021c14] p-5 rounded-xl border border-emerald-500/20 font-mono text-xs text-emerald-100 leading-relaxed whitespace-pre-wrap">
                        {prBody}
                      </div>
                    ) : (
                      <div className="p-12 text-center text-emerald-300/60 italic font-mono text-sm">
                        PR body will appear here upon test passage and reviewer sign-off.
                      </div>
                    )}
                  </div>
                )}

                {activeTab === "trace" && (
                  <div className="space-y-2 font-mono text-xs">
                    {logs.length === 0 ? (
                      <div className="p-12 text-center text-emerald-300/60 italic text-sm">
                        WebSocket stream idle. Click "Run Autonomous Fix" to stream agent events live.
                      </div>
                    ) : (
                      logs.map((log, idx) => (
                        <div key={idx} className="p-3 rounded-lg bg-white/5 border border-emerald-500/10 space-y-1">
                          <div className="flex items-center justify-between text-[10px] text-emerald-300/60">
                            <span className="uppercase tracking-wider font-bold text-emerald-300">[{log.node}]</span>
                            <span>{log.timestamp}</span>
                          </div>
                          <div className="text-emerald-100 whitespace-pre-wrap leading-relaxed">{log.text}</div>
                        </div>
                      ))
                    )}
                    <div ref={logsEndRef} />
                  </div>
                )}
              </div>

            </div>
          </div>

          {/* Footer Bar */}
          <footer className="relative z-10 max-w-7xl w-full mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between text-xs text-emerald-100/70 border-t border-emerald-400/20 gap-2">
            <div className="flex items-center gap-2">
              <i className="fa-solid fa-bowl-rice text-emerald-300"></i>
              <span>MiniSoup Autonomous Bug-Fixing Agent &bull; 2026</span>
            </div>
            <div className="flex items-center gap-6">
              <span>LangGraph StateGraph</span>
              <span>Gemini 2.5 Flash</span>
              <span>Voyage AI</span>
              <span>Docker Sandbox</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
